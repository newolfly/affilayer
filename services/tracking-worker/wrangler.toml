name = "affilayer-tracking"
main = "src/index.ts"
compatibility_date = "2026-11-06"
workers_dev = true
upload_source_maps = true

# Custom hostname: go.affilayer.com (zone affilayer.com).
# Deploying with this route attaches the Worker to that hostname and
# Cloudflare provisions the DNS record for it automatically.
# NOTE: the pattern MUST end in /* — a bare hostname pattern only matches
# the exact hostname with no path, so /health, /c/... etc. fell through
# to the CNAME origin and returned Cloudflare 522 (verified 7 Nov 2026:
# bare https://go.affilayer.com/ returned the Worker's {"error":"not found"}
# while /health 522'd). Fixed 7 Nov; needs a redeploy to take effect.
[[routes]]
pattern = "go.affilayer.com/*"
zone_id = "17c94ce53fca917182d3fd91512eb811"

# Secret (set with: wrangler secret put POSTBACK_SECRET).
# HMAC key for POST /conversion. Never put a real value here.
# [vars]
# POSTBACK_SECRET = ""

# Secret (set with: wrangler secret put OPERATOR_TOKEN). R22.
# Bearer token for the operator endpoints /api/stats and /api/clicks.
# Until it is set, those endpoints fall back to POSTBACK_SECRET (see
# isOperator() in src/index.ts); once set, POSTBACK_SECRET no longer
# opens them. The two secrets must never share a value: POSTBACK_SECRET
# is handed to advertisers (it signs their conversions), OPERATOR_TOKEN
# is operator-only and must never be given to an advertiser.
# Rotation (each secret independently): `wrangler secret put <NAME>`
# with the new value, then redeploy; the old value stops working at the
# redeploy. NP_WORKER_PROOF rotates the same way, except the DB row in
# worker_secrets must be regenerated first — DB and Worker must agree,
# so do that one in a single window. Per-advertiser HMAC secrets are
# the follow-up (one key per advertiser, verified per-offer); not built.

# NOWPayments all-rounder (migration 010) — wrangler secrets, never values:
#   NOWPAYMENTS_API_KEY   — the 'AffiLayer' API key.
#   NOWPAYMENTS_EMAIL / NOWPAYMENTS_PASSWORD — dashboard login; only used
#     to mint the 5-minute payout JWT via POST /v1/auth.
#   NOWPAYMENTS_TOTP_SECRET — optional app-based 2FA seed; when set, the
#     Worker auto-verifies payouts. Without it, payouts wait for a manual
#     verification (dashboard, or the admin UI code entry).
#   NP_WORKER_PROOF — random secret shared with the DB
#     (worker_secrets.np_ipn_proof, seeded by migration 010 — or by 012,
#     which creates the table first; read it once via SQL and set it
#     here). Authenticates the no-JWT IPN paths AND the 012 list RPCs
#     (tracking_list_clicks / tracking_list_conversions): without this
#     secret the Worker's SmartLink caps and /api/stats fail loudly
#     (the lists raise insufficient_privilege), so the Worker MUST be
#     deployed with NP_WORKER_PROOF set after 012 is applied live.
#   NOWPAYMENTS_ENV — 'production' | 'sandbox'. UNSET = payments module
#     disabled (all payment endpoints 503). Sandbox base is
#     https://api-sandbox.nowpayments.io/v1 (separate sandbox account/key).
# NEVER change the account-level IPN setting — it belongs to InboxNumber.
# AffiLayer uses per-payment/per-payout ipn_callback_url only, and verifies
# IPNs by re-fetching status from the API (the IPN secret is shared).

# Durable store (migration 007): the Worker calls Supabase RPCs with the
# publishable anon key. Both values are public — the web bundle already
# ships them — so they are vars, never secrets. Without them the Worker
# runs fully in-memory (demo mode).
[vars]
SUPABASE_URL = "https://cpaxrqwqyjutrscqvqjp.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_KVkx2s_BCgyvIng7RarhSw_5Sxdc_6w"
