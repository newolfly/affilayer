name = "affilayer-tracking"
main = "src/index.ts"
compatibility_date = "2026-11-06"
workers_dev = true
upload_source_maps = true

# Custom hostname: go.affilayer.com (zone affilayer.com).
# Deploying with this route attaches the Worker to that hostname and
# Cloudflare provisions the DNS record for it automatically.
# NOTE: the pattern MUST end in /* — a bare hostname pattern only matches
# the exact hostname with no path, so /health, /c/... etc. fell through
# to the CNAME origin and returned Cloudflare 522 (verified 7 Nov 2026:
# bare https://go.affilayer.com/ returned the Worker's {"error":"not found"}
# while /health 522'd). Fixed 7 Nov; needs a redeploy to take effect.
[[routes]]
pattern = "go.affilayer.com/*"
zone_id = "17c94ce53fca917182d3fd91512eb811"

# Secret (set with: wrangler secret put POSTBACK_SECRET).
# HMAC key for POST /conversion. Never put a real value here.
# [vars]
# POSTBACK_SECRET = ""

# Durable store (migration 007): the Worker calls Supabase RPCs with the
# publishable anon key. Both values are public — the web bundle already
# ships them — so they are vars, never secrets. Without them the Worker
# runs fully in-memory (demo mode).
[vars]
SUPABASE_URL = "https://cpaxrqwqyjutrscqvqjp.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_KVkx2s_BCgyvIng7RarhSw_5Sxdc_6w"
