<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AffiLayer — a global CPA affiliate marketing network connecting advertisers and affiliates with transparent tracking, reporting and payouts." />
    <meta name="theme-color" content="#070D1A" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="AffiLayer" />
    <meta property="og:title" content="AffiLayer — Global CPA Affiliate Network" />
    <meta property="og:description" content="Direct CPA offers and SmartLink routing, with full-funnel tracking and an auditable commission ledger." />
    <meta property="og:url" content="https://affilayer.com/" />
    <meta property="og:image" content="https://affilayer.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AffiLayer — Global CPA Affiliate Network" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="AffiLayer — Global CPA Affiliate Network" />
    <meta name="twitter:description" content="Direct CPA offers and SmartLink routing, with full-funnel tracking and an auditable commission ledger." />
    <meta name="twitter:image" content="https://affilayer.com/og-image.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <title>AffiLayer — Global CPA Affiliate Network</title>
    <noscript><style>.reveal { opacity: 1 !important; transform: none !important; }</style></noscript>
    <style>
      /* First-paint branded loader inside #root — React replaces it on mount. */
      @keyframes affilayer-boot-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }
      @keyframes affilayer-boot-sweep { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div style="min-height:100vh;background:#070D1A;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:ui-sans-serif,system-ui,sans-serif">
        <img src="/logo-mark.svg" alt="AffiLayer" width="48" height="48" style="animation:affilayer-boot-pulse 1.4s ease-in-out infinite" />
        <p style="margin-top:16px;font-size:18px;font-weight:700;color:#ffffff">AffiLayer</p>
        <div style="margin-top:24px;height:6px;width:192px;border-radius:9999px;background:#1E2A3F;overflow:hidden">
          <div style="height:100%;width:50%;border-radius:9999px;background:linear-gradient(90deg,#D97706,#F59E0B,#FBBF24);animation:affilayer-boot-sweep 1.2s ease-in-out infinite"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
